<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patient Home Care BD</title>
<style>
:root{--bg:#f0f5f3;--card:#fff;--tx:#0e2b26;--mu:#6b8a84;--ac:#0b7d68;--ac2:#f5a524;--bd:#e2ece9;--dg:#dc3f55;--ok:#16a34a;--on:#e3f6ef}
[data-theme=dark]{--bg:#07130f;--card:#0f221d;--tx:#e4f3f0;--mu:#8fb0aa;--bd:#1f3b35;--on:#15332c}
*{box-sizing:border-box}body{margin:0;display:flex;min-height:100vh;font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.sb{width:252px;flex:none;background:var(--card);border-right:1px solid var(--bd);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.br{display:flex;gap:10px;align-items:center;margin-bottom:18px}.br img,.br .lg0{width:40px;height:40px;border-radius:12px;object-fit:cover;background:var(--ac);display:grid;place-items:center;color:#fff}.br small{display:block;color:var(--mu);font-size:11px}
.ml{display:block;color:var(--mu);font-size:11px;letter-spacing:1px;margin:0 6px 8px}
.sb a{display:block;padding:10px 12px;border-radius:12px;cursor:pointer;margin-bottom:4px}.sb a b{display:block;font-size:14px}.sb a small{color:var(--mu);font-size:11px}.sb a.on{background:var(--on);box-shadow:inset 3px 0 0 var(--ac)}.sb a:hover{background:var(--on)}
.cn{flex:1;min-width:0}.tb{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}.tb #pt{font-weight:700;flex:1}.hot{background:var(--bg);padding:6px 12px;border-radius:20px;font-size:12px}
main{padding:22px 24px;max-width:1300px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.ph{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--ac);border-radius:18px;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.ph h1{margin:0;font-size:22px}.ph small{color:var(--mu)}.hb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--ac);color:#fff;border:0;padding:9px 15px;border-radius:10px;cursor:pointer;font-size:13px}.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--dg)}.btn.k{background:#0e2b26}.btn.bl{background:#1d7fd6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.st{display:flex;justify-content:space-between;align-items:flex-start}.st small{color:var(--mu);display:block}.st b{display:block;font-size:25px;margin:6px 0;font-family:Consolas,monospace}.st i{font-style:normal;width:38px;height:38px;border-radius:11px;background:var(--on);display:grid;place-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--bd);vertical-align:middle}th{color:var(--mu);font-weight:600;background:var(--bg);white-space:nowrap}
.wrap{overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:16px;margin-bottom:16px}.wh{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--bd)}.wh h3{margin:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}
.md{background:var(--card);border-radius:18px;padding:20px;width:560px;max-width:100%;max-height:92vh;overflow:auto;border-top:5px solid var(--ac)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
.ck{display:flex;gap:8px;align-items:center;margin:4px 0}.ck input{width:auto}.av{width:34px;height:34px;border-radius:50%;object-fit:cover}
.tag{padding:2px 9px;border-radius:20px;background:#d6f2e9;color:#0a5c49;font-size:12px}.bad{color:var(--dg);font-weight:600}.mn{font-family:Consolas,monospace}
.bg{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}.bg.g{background:#dcf5e7;color:#15803d}.bg.r{background:#fde4e8;color:#c2273f}
.fl{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px}.fl a{padding:6px 12px;border-radius:9px;cursor:pointer;font-size:12px}.fl a.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:700}
.ban{background:#fff6dc;border:1px solid #f1cf70;border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;color:#6b4a00;flex-wrap:wrap}
.lgw{min-height:100vh;width:100%;display:grid;place-items:center;background:linear-gradient(160deg,#052520,#0f6b5a);padding:16px}#login{width:360px;max-width:100%;background:#fff;color:#10302b;border-radius:22px;padding:28px;text-align:center}#login label{text-align:left}#login .lg0{width:54px;height:54px;border-radius:15px;background:#0b7d68;color:#fff;display:grid;place-items:center;margin:0 auto 10px;font-size:26px}#login .btn{width:100%;padding:12px;margin-top:8px}
@media(max-width:860px){body{flex-direction:column}.sb{width:100%;height:auto;position:static;display:flex;overflow:auto;gap:4px;padding:8px}.sb a small,.ml,.sb .br{display:none}.sb a{white-space:nowrap}main{padding:12px}.tb{padding:10px 12px}}
</style></head><body>
<script>
const API='https://script.google.com/macros/s/AKfycbyBvOqRyKAXR0uL0bf7P7tmdPg0nT8YlIXSEFTONQVm4Ase15Xwn8tkGQ1WjB1L6XER/exec';
const F={
employees:[['name','Full Name'],['phone','Phone','tel'],['cat','Category','cat',['Nurse','Aya','Ward Boy','Physiotherapist','Caregiver']],['salary','Monthly Salary','number'],['status','Status','sel',['Active','Free','Inactive']],['address','Address','area'],['photo','Photo','file'],['cv','CV','file'],['files','Other Files','files']],
clients:[['_h1','Patient Information','hd'],['name','Patient Name'],['guardian','Guardian / Contact Person Name'],['age','Age','number'],['gender','Gender','sel',['Male','Female','Other']],['phone','Mobile Number','tel'],['phone2','Alternative / Emergency Number','tel'],['area','Area / District *'],['address','Full Patient Address','area'],['_h2','Service & Caregiver Selection','hd'],['cat','Service Type','cat',['Nursing','24-Hour Caregiver','Day Shift Nurse','Night Shift Nurse','Patient Care','Elderly Care','Physiotherapy','Baby Care']],['emps','Assigned Staff / Caregiver (one or more)','emps'],['emp_manual','Or type staff name manually'],['start','Service Start Date','date'],['condition','Patient Health Condition / Disease Details','area'],['_h3','Contract & Billing','hd'],['ctype','Contract Type','sel',['Monthly','Weekly','Daily','One-time']],['fee','Contract Amount (BDT) - monthly fee for monthly contracts','number'],['advance','Advance Received (BDT)','number'],['method','Payment Method','cat',['Cash','Bank','bKash','Nagad']],['note','Special Notes','area']],
income:[['date','Date','date'],['client','Client','client'],['cat','Category','cat',['Monthly Fee','Advance','Registration Fee','Other']],['method','Payment Method','cat',['Cash','Bank','bKash','Nagad']],['amount','Amount (BDT)','number'],['note','Note','area']],
expenses:[['date','Date','date'],['cat','Category','cat',['Transport','Office Rent','Utilities','Marketing','Equipment','Other']],['method','Payment Method','cat',['Cash','Bank','bKash','Nagad']],['amount','Amount (BDT)','number'],['note','Note','area']],
salaries:[['month','Month','month'],['emp','Employee','emp'],['method','Payment Method','cat',['Cash','Bank','bKash','Nagad']],['amount','Amount (BDT)','number'],['note','Note','area']]};
const P={dash:'Dashboard',employees:'Employees',clients:'Clients',accounts:'Accounts & Expenses',salary:'Salary Sheet',records:'Invoices & Records',alerts:'Alerts',settings:'Company Settings',income:'Client Payment',expenses:'Expense',salaries:'Salary Payment'};
const COLS={clients:['name','guardian','phone','area','cat','fee','start','emps'],employees:['name','phone','cat','salary','status','photo','cv']};
const TD=()=>new Date().toISOString().slice(0,10);
const NAV=[['dash','Dashboard','Live overview'],['clients','Clients','Patients & assignments'],['employees','Employees','Nurses & staff'],['accounts','Accounts & Expenses','Bills, salary & expenses'],['salary','Salary Sheet','Paid & unpaid staff'],['records','Invoices & Records','Old invoices & salary slips'],['alerts','Alerts','Unpaid bills & salary'],['settings','Company Settings','Name, logo, login']];
let U=JSON.parse(localStorage.u||'null'),D={},page='dash',month=new Date().toISOString().slice(0,7),modal=false;
document.documentElement.dataset.theme=localStorage.th||'light';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s),N=v=>Number(v)||0,tk=n=>'৳'+N(n).toLocaleString();
const thumb=id=>`https://drive.google.com/thumbnail?id=${id}&sz=w300`;
async function call(a){const r=await fetch(API,{method:'POST',body:JSON.stringify({...a,user:U?.user,pass:U?.pass})});const j=await r.json();if(j.error)throw j.error;return j}
async function load(){if(!U||modal)return;try{D=await call({action:'all'});if((page=='settings'&&$('#s_name'))||document.activeElement?.id=='q'){const n=$('.br b');if(n)n.textContent=S().name||'Patient Home Care BD'}else draw()}catch(e){if(/Invalid/.test(String(e)))return logout();const m=$('#m');if(m&&!Object.keys(D).length)m.innerHTML=`<div class="card bad">Could not load data: ${esc(e.message||e)}<br><br><button class="btn" onclick="load()">Retry</button></div>`}}
function logout(){localStorage.removeItem('u');U=null;boot()}
const nm=(t,i)=>(D[t]?.find(x=>x.id==i)||{}).name||'';
const S=()=>D.settings?.[0]||{};
function boot(){document.body.innerHTML=U?`<aside class="sb"><div class="br">${S().logo?`<img src="${thumb(S().logo)}">`:'<div class="lg0">🏥</div>'}<div><b>${esc(S().name||'Patient Home Care BD')}</b><small>Home Nursing Services</small></div></div><span class="ml">MAIN MENU</span>${NAV.map(([k,v,d])=>`<a id="n_${k}" onclick="go('${k}')"><b>${v}</b><small>${d}</small></a>`).join('')}</aside><div class="cn"><div class="tb"><span id="pt"></span><span class="hot">Hotline: ${esc(S().phone||'—')}</span><button class="btn s" onclick="theme()">◐ Theme</button><button class="btn s" onclick="logout()">Logout</button></div><main id="m"></main></div>`:`<div class="lgw"><div id="login"><div class="lg0">🏥</div><h2>Patient Home Care BD</h2><small>Enter your User ID and password to continue</small><label>User ID</label><input id="lu"><label>Password</label><input id="lp" type="password" onkeydown="if(event.key=='Enter')login()"><p id="le" class="bad"></p><button class="btn" onclick="login()">Sign In →</button></div></div>`;if(U)load()}
async function login(){U={user:$('#lu').value,pass:$('#lp').value};try{await call({action:'login'});localStorage.u=JSON.stringify(U);boot()}catch(e){U=null;$('#le').textContent=e}}
function theme(){const t=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.th=t}
function go(p){page=p;q='';draw()}
function draw(){try{draw0()}catch(e){$('#m').innerHTML=`<div class="card bad">Display error: ${esc(e.message||e)}</div>`}}
const ph=(t,d,b)=>`<div class="ph"><div><h1>${t}</h1><small>${d}</small></div><div class="hb">${b}</div></div>`;
const MO=()=>`<span>Month <input type="month" value="${month}" onchange="month=this.value;draw()" style="width:auto"></span>`;
function draw0(){if(!U||!$('#m'))return;document.querySelectorAll('.sb a').forEach(a=>a.classList.toggle('on',a.id=='n_'+page));
 const nw=t=>ph(P[t],t=='clients'?'Patients, services and assigned staff':'Staff profiles, documents and status',`<button class="btn" onclick="openForm('${t}')">+ New ${t=='clients'?'Client':'Employee'}</button>`);
 const pg={dash,accounts,salary,records,alerts:()=>ph('Alerts','Month-end unpaid clients and staff salaries','')+alerts(),settings:()=>ph('Company Settings','Company profile and admin login','')+settings()}[page]||(()=>nw(page)+table(page));
 $('#m').innerHTML=pg();const n=$('.br b');if(n)n.textContent=S().name||'Patient Home Care BD';$('#pt').textContent=P[page]||''}
function dash(){const e=D.employees||[],c=D.clients||[],mi=(D.income||[]).filter(x=>x.date?.startsWith(month)),me=(D.expenses||[]).filter(x=>x.date?.startsWith(month)),ms=(D.salaries||[]).filter(x=>x.month==month),today=new Date().toISOString().slice(0,10);
 const sum=a=>a.reduce((s,x)=>s+N(x.amount),0),assigned=new Set(c.flatMap(x=>(x.emps||'').split(',')).filter(Boolean)),act=e.filter(x=>x.status!='Inactive'),work=act.filter(x=>assigned.has(x.id)).length;
 const ex=D.expenses||[],avg=ex.length?sum(ex)/ex.length:0,card=(a,b,ic,ft='')=>`<div class="card st"><div><small>${a}</small><b>${b}</b>${ft?`<small>${ft}</small>`:''}</div><i>${ic}</i></div>`;
 const rows=c.map(x=>{const ids=(x.emps||'').split(',').filter(Boolean),paid=(D.income||[]).some(i=>i.client==x.id&&i.date?.startsWith(month));
  return `<tr><td><b>${esc(x.name)}</b><br><small>${esc(x.phone)} · ${esc(x.address)}</small></td><td>${esc(x.cat)}<br><b>${tk(x.fee)}</b>/month<br><small>Since ${esc(x.start)}</small></td><td>${ids.map(i=>{const q2=e.find(z=>z.id==i);return q2?`<div class="ck">${q2.photo?`<img class="av" src="${thumb(q2.photo.split('|')[1])}">`:''}<span>${esc(q2.name)}<br><small>${esc(q2.cat)}</small></span></div>`:''}).join('')||'<small>None assigned</small>'}</td><td><span class="bg ${paid?'g':'r'}">${paid?'PAID':'DUE'}</span></td><td style="white-space:nowrap"><button class="btn s" onclick="openForm('clients','${x.id}')">Manage</button> ${paid?'':`<button class="btn" onclick="openForm('income',null,{client:'${x.id}',date:'${today}',amount:'${x.fee}',cat:'Monthly Fee'})">Receive</button>`}</td></tr>`}).join('')||'<tr><td colspan="5">No clients yet</td></tr>';
 return ph('Business Dashboard & Control Center',esc(S().name||'Patient Home Care BD')+' · live staff and service status',`${MO()}<button class="btn k" onclick="go('salary')">Salary Sheet</button><button class="btn" onclick="openForm('clients')">+ New Client</button><button class="btn s" onclick="openForm('employees')">+ New Employee</button><button class="btn s" onclick="go('accounts')">Accounts</button>`)+`<div class="grid">
 ${card('Total Employees',e.length,'👩‍⚕️','<span style="color:var(--ok)">'+(act.length-work)+' free</span> · '+work+' working')}${card('Total Clients',c.length,'🏠')}${card('Client Contract Value',tk(sum(c.map(x=>({amount:x.fee})))),'📄','Monthly fees of all clients')}${card('Total Staff Salary',tk(sum(act.map(x=>({amount:x.salary})))),'💼','Monthly salary scale')}${card('Monthly Income',tk(sum(mi)),'💰')}${card('Monthly Expense',tk(sum(me)),'🧾')}${card('Monthly Salary Paid',tk(sum(ms)),'✅')}${card('Monthly Profit',tk(sum(mi)-sum(me)-sum(ms)),'📈')}${card('Average Expense',tk(avg),'📊')}${card('Total Received (All)',tk(sum(D.income||[])),'🏦')}${card('Total Contacts',c.length+e.length,'📞')}</div>
 <div class="wrap"><div class="wh"><h3>Which Employee Works With Which Client</h3><small>Payment status for ${month}</small></div><table><tr><th>Client & Contact</th><th>Service & Monthly Fee</th><th>Assigned Employees</th><th>Status</th><th>Actions</th></tr>${rows}</table></div>`}
let fl='all',q='';
function L(){const a=[];(D.income||[]).forEach(r=>a.push({t:'income',k:'income',id:r.id,d:r.date,ds:nm('clients',r.client)+(r.note?' — '+r.note:''),c:r.cat||'',m:r.method,a:N(r.amount)}));(D.expenses||[]).forEach(r=>a.push({t:'expenses',k:'expense',id:r.id,d:r.date,ds:r.note||r.cat||'Expense',c:r.cat||'',m:r.method,a:-N(r.amount)}));(D.salaries||[]).forEach(r=>a.push({t:'salaries',k:'salary',id:r.id,d:r.month,ds:nm('employees',r.emp)+' — '+r.month+' salary',c:'Staff Salary',m:r.method,a:-N(r.amount)}));return a.sort((x,y)=>(y.d||'').localeCompare(x.d||''))}
function lrows(){return L().filter(x=>(fl=='all'||x.k==fl)&&(x.ds+x.c).toLowerCase().includes(q.toLowerCase())).map(x=>`<tr><td class="mn">${esc(x.d)}</td><td>${esc(x.ds)}</td><td>${esc(x.c)}</td><td>${esc(x.m||'—')}</td><td class="mn" style="font-weight:700;color:${x.a<0?'var(--dg)':'var(--ok)'}">${x.a<0?'−':'+'} ${tk(Math.abs(x.a))}</td><td style="white-space:nowrap">${x.k!='expense'?`<button class="btn s" onclick="inv('${x.t}','${x.id}')">Print</button> `:''}<button class="btn s" onclick="openForm('${x.t}','${x.id}')">Edit</button> <button class="btn d" onclick="rm('${x.t}','${x.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan="6">No records</td></tr>'}
function setFl(x){fl=x;draw()}
function unpaid(){const c=(D.clients||[]).filter(x=>!(D.income||[]).some(i=>i.client==x.id&&i.date?.startsWith(month))),e=(D.employees||[]).filter(x=>x.status!='Inactive'&&!(D.salaries||[]).some(s=>s.emp==x.id&&s.month==month));return{c,e}}
function accounts(){const sm=a=>(D[a]||[]).reduce((s,x)=>s+N(x.amount),0),I=sm('income'),E=sm('expenses'),Sl=sm('salaries'),sc=(D.employees||[]).filter(x=>x.status!='Inactive').reduce((s,x)=>s+N(x.salary),0),u=unpaid(),n=a=>L().filter(x=>x.k==a).length,
 card=(a,b,ic,ft)=>`<div class="card st"><div><small>${a}</small><b>${b}</b><small>${ft}</small></div><i>${ic}</i></div>`;
 return ph('Accounts & Expenses','Invoices, staff salary and expenses in one ledger',`<button class="btn" onclick="openForm('income')">+ Income</button><button class="btn k" onclick="openForm('expenses')">+ Expense</button><button class="btn s" onclick="go('salary')">Salary Sheet</button>`)+
 (u.c.length+u.e.length?`<div class="ban"><span>🔔 <b>Month-end alerts (${month}):</b> ${u.c.length} client(s) unpaid · ${u.e.length} employee salary unpaid</span><button class="btn s" onclick="go('alerts')">View alerts</button></div>`:'')+
 `<div class="grid">${card('Total Income',tk(I),'📈','Client service fees received')}${card('Total Expense & Salary',tk(E+Sl),'📉','Staff salary and running costs')}${card('Net Balance',tk(I-E-Sl),'💲',I-E-Sl<0?'Deficit':'Surplus')}${card('Monthly Salary Scale',tk(sc),'💼','Fixed salary of all active staff')}</div>
 <div class="wrap"><div class="wh"><input id="q" placeholder="Search description or category..." value="${esc(q)}" oninput="q=this.value;$('#lb').innerHTML=lrows()" style="max-width:320px"><div class="fl">${[['all','All',L().length],['income','Income',n('income')],['expense','Expense',n('expense')],['salary','Salary',n('salary')]].map(([k,l,c])=>`<a class="${fl==k?'on':''}" onclick="setFl('${k}')">${l} (${c})</a>`).join('')}</div></div>
 <table><tr><th>Date</th><th>Description</th><th>Category</th><th>Payment Method</th><th>Amount (BDT)</th><th>Actions</th></tr><tbody id="lb">${lrows()}</tbody></table></div>`}
function salary(){const act=(D.employees||[]).filter(x=>x.status!='Inactive'),pm=e=>(D.salaries||[]).find(s=>s.emp==e.id&&s.month==month),pd=act.filter(pm),un=act.filter(e=>!pm(e)),sm=a=>a.reduce((s,x)=>s+N(x.salary),0),
 who=e=>`<div class="ck">${e.photo?`<img class="av" src="${thumb(e.photo.split('|')[1])}">`:''}<span><b>${esc(e.name)}</b><br><small>${esc(e.cat)} · ${esc(e.phone)}</small></span></div>`,
 card=(a,b,ic,ft)=>`<div class="card st"><div><small>${a}</small><b>${b}</b><small>${ft}</small></div><i>${ic}</i></div>`;
 return ph('Salary Sheet','Pay staff salary and print salary sheets',`${MO()}<button class="btn k" onclick="printSheet()">Print Salary Sheet</button>`)+
 `<div class="grid">${card('Total Payable',tk(sm(act)),'💼',act.length+' active staff')}${card('Paid',tk(pd.reduce((s,e)=>s+N(pm(e).amount),0)),'✅',pd.length+' employee(s)')}${card('Unpaid',tk(sm(un)),'⏳',un.length+' employee(s)')}</div>
