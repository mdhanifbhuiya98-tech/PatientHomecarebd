<script>

employees:[['name','Full Name'],['nid','NID Card Number'],['phone','Phone','tel'],['cat','Category','cat',['Nurse','Aya','Ward Boy','Physiotherapist','Caregiver']],['salary','Monthly Salary','number'],['status','Status','sel',['Active','Free','Inactive']],['address','Address','area'],['photo','Photo','file'],['cv','CV','file'],['files','Other Files','files']],

let U=JSON.parse(localStorage.u||'null'),D={},page='dash',month=new Date().toISOString().slice(0,7),modal=false;

async function login(){U={user:$('#lu').value,pass:$('#lp').value};try{await call({action:'login'});localStorage.u=JSON.stringify(U);boot()}catch(e){U=null;$('#le').textContent=e}}

 const nw=t=>ph(P[t],t=='clients'?'Patients, services and assigned staff':'Staff profiles, documents and status',`<button class="btn" onclick="openForm('${t}')">+ New ${t=='clients'?'Client':'Employee'}</button>`);

 $('#m').innerHTML=pg();const n=$('.br b');if(n)n.textContent=S().name||'Patient Home Care BD';$('#pt').textContent=P[page]||''}
function dash(){const e=D.employees||[],c=(D.clients||[]).filter(x=>x.status!='Closed'),mi=(D.income||[]).filter(x=>x.date?.startsWith(month)),me=(D.expenses||[]).filter(x=>x.date?.startsWith(month)),ms=(D.salaries||[]).filter(x=>x.month==month),today=new Date().toISOString().slice(0,10);
 const sum=a=>a.reduce((s,x)=>s+N(x.amount),0),assigned=new Set(c.flatMap(x=>(x.emps||'').split(',')).filter(Boolean)),act=e.filter(x=>x.status!='Inactive'),work=act.filter(x=>assigned.has(x.id)).length;
 const ex=D.expenses||[],avg=ex.length?sum(ex)/ex.length:0,card=(a,b,ic,ft='')=>`<div class="card st"><div><small>${a}</small><b>${b}</b>${ft?`<small>${ft}</small>`:''}</div><i>${ic}</i></div>`;
 const rows=c.map(x=>{const ids=(x.emps||'').split(',').filter(Boolean),paid=(D.income||[]).some(i=>i.client==x.id&&i.date?.startsWith(month));
  return `<tr><td><b>${esc(x.name)}</b><br><small>${esc(x.phone)} · ${esc(x.address)}</small></td><td>${esc(x.cat)}<br><b>${tk(x.fee)}</b>/month<br><small>Since ${esc(x.start)}</small></td><td>${ids.map(i=>{const q2=e.find(z=>z.id==i);return q2?`<div class="ck">${q2.photo?`<img class="av" src="${thumb(q2.photo.split('|')[1])}">`:''}<span>${esc(q2.name)}<br><small>${esc(q2.cat)}</small></span></div>`:''}).join('')||'<small>None assigned</small>'}</td><td><span class="bg ${paid?'g':'r'}">${paid?'PAID':'DUE'}</span></td><td style="white-space:nowrap"><button class="btn s" onclick="openForm('clients','${x.id}')">Manage</button> ${paid?'':`<button class="btn" onclick="openForm('income',null,{client:'${x.id}',date:'${today}',amount:'${x.fee}',cat:'Monthly Fee'})">Receive</button>`}</td></tr>`}).join('')||'<tr><td colspan="5">No clients yet</td></tr>';
 return ph('Business Dashboard & Control Center',esc(S().name||'Patient Home Care BD')+' · live staff and service status',`${MO()}<button class="btn k" onclick="go('salary')">Salary Sheet</button><button class="btn" onclick="openForm('clients')">+ New Client</button><button class="btn s" onclick="openForm('employees')">+ New Employee</button><button class="btn s" onclick="go('accounts')">Accounts</button>`)+`<div class="grid">
 ${card('Total Employees',e.length,'👩‍⚕️','<span style="color:var(--ok)">'+(act.length-work)+' free</span> · '+work+' working')}${card('Total Clients',c.length,'🏠')}${card('Client Contract Value',tk(sum(c.map(x=>({amount:x.fee})))),'📄','Monthly fees of all clients')}${card('Total Staff Salary',tk(sum(act.map(x=>({amount:x.salary})))),'💼','Monthly salary scale')}${card('Monthly Income',tk(sum(mi)),'💰')}${card('Monthly Expense',tk(sum(me)),'🧾')}${card('Monthly Salary Paid',tk(sum(ms)),'✅')}${card('Monthly Profit',tk(sum(mi)-sum(me)-sum(ms)),'📈')}${card('Average Expense',tk(avg),'📊')}${card('Total Received (All)',tk(sum(D.income||[])),'🏦')}${card('Total Contacts',c.length+e.length,'📞')}</div>
 <div class="wrap"><div class="wh"><h3>Which Employee Works With Which Client</h3><small>Payment status for ${month}</small></div><table><tr><th>Client & Contact</th><th>Service & Monthly Fee</th><th>Assigned Employees</th><th>Status</th><th>Actions</th></tr>${rows}</table></div>`}
let fl='all',q='';

function accounts(){const sm=a=>(D[a]||[]).reduce((s,x)=>s+N(x.amount),0),I=sm('income'),E=sm('expenses'),Sl=sm('salaries'),sc=(D.employees||[]).filter(x=>x.status!='Inactive').reduce((s,x)=>s+N(x.salary),0),u=unpaid(),n=a=>L().filter(x=>x.k==a).length,

 `<div class="grid">${card('Total Income',tk(I),'📈','Client service fees received')}${card('Total Expense & Salary',tk(E+Sl),'📉','Staff salary and running costs')}${card('Net Balance',tk(I-E-Sl),'💲',I-E-Sl<0?'Deficit':'Surplus')}${card('Monthly Salary Scale',tk(sc),'💼','Fixed salary of all active staff')}</div>
 <div class="wrap"><div class="wh"><input id="q" placeholder="Search description or category..." value="${esc(q)}" oninput="q=this.value;$('#lb').innerHTML=lrows()" style="max-width:320px"><div class="fl">${[['all','All',L().length],['income','Income',n('income')],['expense','Expense',n('expense')],['salary','Salary',n('salary')]].map(([k,l,c])=>`<a class="${fl==k?'on':''}" onclick="setFl('${k}')">${l} (${c})</a>`).join('')}</div></div>
 <table><tr><th>Date</th><th>Description</th><th>Category</th><th>Payment Method</th><th>Amount (BDT)</th><th>Actions</th></tr><tbody id="lb">${lrows()}</tbody></table></div>`}
function salary(){const act=(D.employees||[]).filter(x=>x.status!='Inactive'),pm=e=>(D.salaries||[]).find(s=>s.emp==e.id&&s.month==month),pd=act.filter(pm),un=act.filter(e=>!pm(e)),sm=a=>a.reduce((s,x)=>s+N(x.salary),0),
 who=e=>`<div class="ck">${e.photo?`<img class="av" src="${thumb(e.photo.split('|')[1])}">`:''}<span><b>${esc(e.name)}</b><br><small>${esc(e.cat)} · ${esc(e.phone)}</small></span></div>`,

function table(t){const fs=tcols(t),lead=t=='clients'||t=='employees',L=D[t]||[],a=L.filter(r=>!off(r)).length;return `<div class="wrap">${lead?`<div class="wh"><input id="q" placeholder="Search by ID, name or mobile number..." value="${esc(q)}" oninput="q=this.value;$('#tb').innerHTML=trows('${t}')" style="max-width:360px"><div class="fl">${[['active','Active',a],['inactive',t=='clients'?'Closed':'Inactive',L.length-a],['all','All',L.length]].map(([k,l,c])=>`<a class="${sf==k?'on':''}" onclick="setSf('${k}')">${l} (${c})</a>`).join('')}</div></div>`:''}<table><tr>${fs.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr><tbody id="tb">${trows(t)}</tbody></table></div>`}
function alerts(){const u=unpaid(),t=TD(),row=(a,b,c)=>`<div class="ck" style="justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--bd);padding:8px 0"><span><b>${esc(a)}</b><br><small>${b}</small></span><span style="white-space:nowrap">${c}</span></div>`;
 return `<div class="top">${MO()}</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))"><div class="card"><h3>Clients not paid (${u.c.length})</h3>${u.c.map(x=>row(x.name,esc(x.phone)+' · Due '+tk(x.fee),`<button class="btn s" onclick="makeInv('${x.id}')">Create Invoice</button> <button class="btn" onclick="openForm('income',null,{client:'${x.id}',date:'${t}',amount:'${x.fee}',cat:'Monthly Fee'})">Receive</button>`)).join('')||'All paid ✓'}</div>
 <div class="card"><h3>Salary not paid (${u.e.length})</h3>${u.e.map(x=>row(x.name,esc(x.cat)+' · Salary '+tk(x.salary),`<button class="btn s" onclick="makeSlip('${x.id}')">Create Slip</button> <button class="btn" onclick="openForm('salaries',null,{month:'${month}',emp:'${x.id}',amount:'${esc(x.salary)}'})">Pay Salary</button>`)).join('')||'All paid ✓'}</div></div>`}
function settings(){const s=S();return `<div class="card" style="max-width:520px">${[['name','Company Name'],['phone','Phone'],['address','Address']].map(([k,l])=>`<label>${l}</label><input id="s_${k}" value="${esc(s[k]||'')}">`).join('')}<label>Logo</label><input type="file" id="s_logo" accept="image/*"><br><br><button class="btn" onclick="saveSet()">Save</button></div><div class="card" style="max-width:520px;margin-top:14px"><h3>Admin Login</h3><label>New User ID</label><input id="a_u" value="${esc(U.user)}"><label>New Password</label><input id="a_p" type="password" placeholder="min 4 characters"><br><br><button class="btn" onclick="saveAcct()">Change ID / Password</button></div>`}
async function saveSet(){modal=true;try{const row={id:'main',logo:S().logo||'',name:$('#s_name').value,phone:$('#s_phone').value,address:$('#s_address').value},f=$('#s_logo').files[0];if(f)row.logo=(await up(f)).id;await call({action:'save',sheet:'settings',row});modal=false;await load();boot()}catch(e){modal=false;alert(e.message||e)}}
async function saveAcct(){const u=$('#a_u').value.trim(),p=$('#a_p').value;if(u.length<3||p.length<4)return alert('User ID min 3, password min 4 characters');try{await call({action:'account',newUser:u,newPass:p});U={user:u,pass:p};localStorage.u=JSON.stringify(U);alert('Updated');load()}catch(e){alert(e.message||e)}}
function up(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=async()=>{try{ok(await call({action:'upload',name:f.name,mime:f.type||'application/octet-stream',data:r.result.split(',')[1]}))}catch(e){no(e)}};r.readAsDataURL(f)})}
function openForm(t,id,pre){modal=true;const r={...((D[t]||[]).find(x=>x.id==id)||{}),...(pre||{})};
 const inp=f=>{const[k,l,ty,o]=f,v=r[k]||'';let h;if(ty=='hd')return `<h4 style="margin:18px 0 0;color:var(--ac);border-bottom:1px solid var(--bd);padding-bottom:4px">${l}</h4>`;
  if(ty=='area')h=`<textarea name="${k}">${esc(v)}</textarea>`;
  else if(ty=='sel')h=`<select name="${k}">${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`;
  else if(ty=='cat')h=`<input name="${k}" list="dl_${t}${k}" value="${esc(v)}" placeholder="Choose or type"><datalist id="dl_${t}${k}">${o.map(x=>`<option>${x}</option>`).join('')}</datalist>`;
  else if(ty=='client'||ty=='emp'){const L=D[ty=='client'?'clients':'employees']||[];h=`<select name="${k}"><option value="">— select —</option>${L.filter(x=>!off(x)||x.id==v).map(x=>`<option value="${x.id}" ${x.id==v?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`}
  else if(ty=='emps'){const sel=v.split(',');h=(D.employees||[]).filter(x=>x.status!='Inactive'||sel.includes(x.id)).map(x=>`<label class="ck"><input type="checkbox" class="em" value="${x.id}" ${sel.includes(x.id)?'checked':''}> ${esc(x.name)} <span class="tag">${esc(x.status)}</span></label>`).join('')}
  else if(ty=='file'||ty=='files')h=`<input type="file" name="${k}" ${ty=='files'?'multiple':''}>${v?`<small>Saved: ${show(f,r)}</small>`:''}`;
  else h=`<input name="${k}" type="${ty||'text'}" value="${esc(v)}">`;return `<label>${l}</label>${h}`};
 document.body.insertAdjacentHTML('beforeend',`<div class="ov"><div class="md"><h3>${id?'Edit':'New'} — ${P[t]}${r.code?' · ID '+r.code:''}</h3><form id="f">${F[t].map(inp).join('')}</form><br><button class="btn" id="sv" onclick="save('${t}','${id||''}')">Save</button> <button class="btn s" onclick="closeM()">Cancel</button></div></div>`)}
function closeM(){document.querySelector('.ov')?.remove();modal=false}
async function save(t,id){const b=$('#sv');b.textContent='Saving...';b.disabled=true;try{let isNew=!id;const old=(D[t]||[]).find(x=>x.id==id)||{},row={...old};if(id)row.id=id;else delete row.id;
 for(const f of F[t]){const k=f[0];if(f[2]=='hd')continue;if(f[2]=='emps')row[k]=[...document.querySelectorAll('.em:checked')].map(x=>x.value).join(',');
  else if(f[2]=='file'||f[2]=='files'){const fl=[...document.querySelector(`[name=${k}]`).files];if(fl.length){const o=[];for(const x of fl){const u=await up(x);o.push(u.name+'|'+u.id)}row[k]=o.join(';')}}
  else row[k]=document.querySelector(`[name=${k}]`).value}
 if(t=='clients'&&(!row.name||!row.area))throw 'Patient name and Area are required';if(t=='employees'&&!row.name)throw 'Employee name is required';
 if(!id&&(t=='employees'||t=='clients')){const m=findDup(t,row);if(m){if(confirm('Existing '+(t=='employees'?'employee':'client')+' found: ID '+(m.code||'-')+' — '+m.name+' ('+(m.status||'Active')+'), matched by name / NID / mobile.\n\nOK = use this existing ID (reactivate and update details)\nCancel = continue as a new record')){row.id=m.id;row.code=m.code;row.status='Active';for(const k in m)if(row[k]===undefined||row[k]==='')row[k]=m[k];isNew=false}else if(!confirm('Create as a NEW record with a new ID?'))throw 'Cancelled'}}
 if(isNew&&(t=='employees'||t=='clients'))row.code=nextCode(t);const res=await call({action:'save',sheet:t,row});if(t=='clients'&&isNew&&N(row.advance)>0)await call({action:'save',sheet:'income',row:{date:row.start||TD(),client:res.row.id,cat:'Advance',method:row.method||'',amount:row.advance,note:'Advance at signup'}});closeM();await load()}catch(e){if(e!='Cancelled')alert(e.message||e);b.textContent='Save';b.disabled=false}}
async function rm(t,id){if(!confirm('Delete this record?'))return;await call({action:'del',sheet:t,id});load()}
brand();boot();setInterval(load,5000);
</script></body></html>
